{% extends 'gestion/base.html' %}

{% block content %}
<h2>{{ titulo }}</h2>
<p>¿Estás seguro de que deseas eliminar <strong>{{ objeto }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Eliminar</button>
    <a href="{% url ruta_cancelar %}">Cancelar</a>
</form>
{% endblock %}
