{% extends 'gestion/base.html' %}

{% block content %}
<div class="alert-box warning">
    <strong>⚠️ Confirmación de eliminación</strong>
    <p class="message-text">¿Estás seguro de que deseas eliminar <strong>{{ objeto }}</strong>? Esta acción no se puede deshacer.</p>
</div>
<form method="post" class="action-row">
    {% csrf_token %}
    <button type="submit" class="btn-delete">🗑️ Eliminar definitivamente</button>
    <a href="{% url ruta_cancelar %}" class="btn-secondary">❌ Cancelar</a>
</form>
{% endblock %}
