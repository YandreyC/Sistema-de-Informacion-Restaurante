{% extends 'gestion/base.html' %}

{% block content %}
<h2>Mesas</h2>
<p><a href="/mesas/crear/">Crear mesa</a></p>
<table>
    <tr>
        <th>ID</th>
        <th>Número</th>
        <th>Capacidad</th>
        <th>Estado</th>
        <th>Acciones</th>
    </tr>
    {% for mesa in mesas %}
    <tr>
        <td>{{ mesa.id }}</td>
        <td>{{ mesa.numero_mesa }}</td>
        <td>{{ mesa.capacidad }}</td>
        <td>{{ mesa.estado_mesa }}</td>
        <td>
            <a href="/mesas/{{ mesa.id }}/editar/">Editar</a> |
            <a href="/mesas/{{ mesa.id }}/eliminar/">Eliminar</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
